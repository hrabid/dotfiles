##### STATIC FALLBACK THEME COLORS #####
# Used when ~/.config/tmux/colors-matugen.conf doesn't exist yet
# (e.g. matugen hasn't run on this machine, or generation failed).
# This is the exact original gold/gray palette.

# Accent color (teal)
set -g @tc "#00abab"

# Grays
set -g @g0 "#262626"
set -g @g1 "#303030"
set -g @g2 "#3a3a3a"
set -g @g3 "#444444"
set -g @g4 "#626262"
